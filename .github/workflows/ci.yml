name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Быстрая проверка: код, протокол MCP, тесты без демо-прогонов.
  unit:
    name: Тесты и MCP-протокол (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pto.txt
      - name: Демо-данные (смета, журнал, акты, нормы, чертёж, redline-скан)
        run: |
          python scripts/make_demo_data.py
          python scripts/make_demo_dxf.py
          python scripts/make_demo_redline.py
      - name: Сверка КС-2 (создаёт out/summary.json для тестов)
        run: python -m pto_agent run --data data/demo --out out
      - name: Реестры OSS (платформа, takeoff, ТК/ППР) — офлайн, без сети
        run: |
          python scripts/check_platform_oss.py --offline
          python scripts/check_platform_oss.py --offline --list data/reference/tk_ppr_oss.json
          python scripts/check_takeoff_oss.py
      - name: Черновики ТК по всем видам работ (нет пустых разделов и «сверенных» норм без цитаты)
        run: python scripts/check_tk_all_work_types.py
      - name: Реестр ТК (файлы не затираются, подпись не переживает правку, нет «готово»)
        run: python scripts/check_tk_registry.py
      - name: Ведомость и АТН (сумма акта ≠ сумма позиций, АТН только с основанием и ценой)
        run: python scripts/check_cumulative_atn.py
      - name: Расход материалов (норма без источника не применяется, перерасход без причины — ошибка)
        run: python scripts/check_consumption.py
      - name: Чек-листы (пункт без источника не создаётся, непроверенное не подписывается)
        run: python scripts/check_checklists.py
      - name: Журналы (запись без исполнителя не проходит, допуск без документа качества невозможен)
        run: python scripts/check_journals.py
      - name: Документы качества (документ на другую партию не закрывает применённую)
        run: python scripts/check_quality_docs.py
      - name: Движение документации (РД «В производство работ», согласование ИД с замечаниями)
        run: python scripts/check_docflow.py
      - name: Переписка и участники (письмо без основания не предъявляется, аттестат на дату работы)
        run: python scripts/check_correspondence.py
      - name: Комплект объекта (нет данных ≠ пройдено, сдаётся только подписанное)
        run: python scripts/check_pack.py
      - name: Портфель комплектов (сколько денег держит непредъявление и что именно мешает)
        run: python scripts/check_pack_portfolio.py
      - name: График финансирования (что попадёт в платёж, что переносится и по какой цене)
        run: python scripts/check_funding.py
      - name: Месячный план (работы месяца → требования матрицы → чего не хватает)
        run: python scripts/check_monthly.py
      - name: Ядро учёта (Дт=Кт на каждом шаге, 10.01 = склад, сторно, закрытие периода)
        run: python scripts/check_ledger.py
      - name: Экраны и роли (права на сервере, ИИ-агент не проводит, аудит с IP)
        run: python scripts/check_web.py
      - name: Тесты
        run: pytest tests -q
      - name: MCP-сервер отвечает по stdio
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | python -m pto_agent.mcp_server --base-dir . \
            | python -c "import json,sys; d=json.load(sys.stdin); n=len(d['result']['tools']); print('инструментов:', n); sys.exit(0 if n==36 else 1)"

  # Полный прогон: выпуск, деньги, портфель актов, дашборд — и все тесты на реальных артефактах.
  e2e:
    name: Сквозной прогон (выпуск → КС-2 → деньги → дашборд)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pto.txt
      - name: Демо-данные и чертежи
        run: |
          python scripts/make_demo_data.py
          python scripts/make_demo_dxf.py
          python scripts/make_demo_redline.py
          python scripts/make_demo_batch.py
          python scripts/make_demo_retro.py
      - name: Сверка КС-2 и объёмов (MVP)
        run: python -m pto_agent run --data data/demo --out out
      - name: Выпуск текущего месяца
        run: |
          python -m pto_agent cad scan-batch \
            --manifest data/demo/batch/manifest.json --engine mock \
            --summary out/summary.json --out out/cad/batch
      - name: Ретро-выпуск по прошлым актам
        run: |
          python -m pto_agent cad scan-batch --manifest data/demo/retro/manifest_ks35.json \
            --engine mock --summary out/acts/summary_ks35.json --out out/cad/batch_ks35
          python -m pto_agent cad scan-batch --manifest data/demo/retro/manifest_ks37.json \
            --engine mock --summary out/acts/summary_ks37.json --out out/cad/batch_ks37
      - name: Деньги и портфель актов
        run: |
          python scripts/make_demo_acts.py
          python -m pto_agent cad impact --batch out/cad/batch/batch_summary.json \
            --summary out/summary.json --out out/cad/impact --with-background
          python -m pto_agent cad impact --acts data/demo/acts/acts.json \
            --summary out/summary.json --out out/cad/portfolio
      - name: Якорь журнала аудита (ловит удаление хвоста)
        run: |
          python -m pto_agent audit anchor --path out/audit.jsonl
          python -m pto_agent audit-verify --path out/audit.jsonl --anchor
      - name: Дашборд руководителя
        run: python docs/build_dashboard.py
      - name: Все тесты на собранных артефактах
        run: pytest tests -q
      - name: Собрать отчёты в артефакт CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            out/cad/portfolio/portfolio.xlsx
            out/cad/batch/batch_summary.xlsx
            out/cad/impact/impact.xlsx
            Дашборд_руководителя_ПТО.html
          if-no-files-found: warn

  docker:
    name: Docker-образ MCP-сервера
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Сборка
        run: docker build -t pto-agent-mcp:ci .
      - name: Запуск и проверка /health
        run: |
          # без токена контейнер обязан отказаться слушать 0.0.0.0
          if docker run --rm --name mcp-notoken -p 8766:8765 pto-agent-mcp:ci; then
            echo "контейнер поднялся без токена — это дефект"; exit 1
          fi
          docker run -d --name mcp -p 8765:8765 -e PTO_MCP_TOKEN=ci-token pto-agent-mcp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health; then echo; break; fi
            sleep 2
          done
          # инструменты под токеном доступны, без токена — 401
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8765/mcp \
            -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"ping"}')
          test "$code" = "401" || { echo "ожидали 401 без токена, получили $code"; docker logs mcp; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8765/mcp \
            -H 'authorization: Bearer ci-token' -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"ping"}')
          test "$code" = "200" || { echo "ожидали 200 с токеном, получили $code"; docker logs mcp; exit 1; }
