[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pto-agent"
version = "0.6.0"
description = "ИИ-агент ПТО: сверка КС-2 и объёмов, распознавание выпуска ИД, деньги под риском, MCP-инструменты"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ПТО-агент" }]
keywords = ["ПТО", "КС-2", "строительство", "MCP", "CAD", "DXF", "redline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "openpyxl==3.1.5",
    "python-docx==1.1.2",
    "PyYAML==6.0.3",
    "pydantic==2.14.1",
    "ezdxf==1.4.5",
    "matplotlib==3.10.9",
    "numpy==2.3.5",
    "scipy==1.17.1",
    "Pillow==12.3.0",
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.33",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "httpx==0.28.1"]

[project.scripts]
pto-agent = "pto_agent.cli:main"
pto-cad = "pto_agent.cad.cli:main"
pto-mcp = "pto_agent.mcp_server:main"
pto-web = "pto_agent.web.__main__:main"

[project.urls]
Homepage = "https://github.com/USER/pto-agent"
Documentation = "https://github.com/USER/pto-agent/tree/main/docs"

[tool.setuptools.packages.find]
include = ["pto_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# чтобы `pytest tests` работал без установки пакета: CI запускает именно так
pythonpath = ["."]
